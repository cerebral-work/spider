[package]
name = "crawllab-ramz-sink"
version = "0.1.0"
edition = "2021"
publish = false
description = "Crawllab spider integration for ramz visual page capture (zstd HTML + GFM Markdown + WebP visual captures) and Reverie visual data plane ingestion"

# Standalone: not a member of the spider workspace, so upstream spider-rs merges stay clean.
[workspace]

[[bin]]
name = "crawllab-ramz-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spider = { path = "../../spider", features = ["sync", "chrome", "chrome_store_page"] }
tokio = { version = "1", features = ["full"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
